name: Build and deploy blog

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out site and theme
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31
        with:
          install_url: https://releases.nixos.org/nix/nix-2.35.2/install
          extra_nix_config: |
            experimental-features = nix-command flakes
            sandbox = true
            accept-flake-config = false

      - name: Check site and build drafts
        run: |
          nix develop --no-update-lock-file -c zola check --drafts --skip-external-links
          nix develop --no-update-lock-file -c zola build --drafts --output-dir "$RUNNER_TEMP/blog-drafts"

      - name: Build site
        run: nix develop --no-update-lock-file -c zola build

      - name: Upload site
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: public/

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
